name: Build iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test the protocol and build the iPhone app
        run: bash Scripts/build-ipa.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Hilo-Companion-IPA
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
